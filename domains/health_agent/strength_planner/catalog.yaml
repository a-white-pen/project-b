  - name: Lateral Raise
    watch_label: Lateral Raise
    garmin: {category: 14, code: 24}          # Garmin "Seated Lateral Raise"
    garmin_aliases: [LATERAL_RAISE, SEATED_LATERAL_RAISE, DUMBBELL_LATERAL_RAISE]
    available_at: [bangkok_condo, singapore_gym]
    equipment: dumbbell
    load_unit: kg
    weight_basis: each_hand
    reps_per_side: false
    movement_pattern: lateral_raise
    role: isolation
    fixed_weight: {value: 3, unit: kg}        # Bangkok condo: fixed 3 kg home pair (B's own DBs)
    fixed_weight_at: [bangkok_condo]          # BKK stays 3 kg; SG gym loads off history (seed below)
    seed_weight: {value: 5, unit: kg}         # Singapore-gym cold-start (loaded adjustable DB)

  - name: Dumbbell Triceps Extension
    watch_label: Dumbbell Triceps Extension
    garmin: {category: 30, code: 15}          # Overhead DB Triceps Extension
    garmin_aliases: [DUMBBELL_TRICEPS_EXTENSION, OVERHEAD_DUMBBELL_TRICEPS_EXTENSION, TRICEPS_EXTENSION]
    available_at: [bangkok_condo, singapore_gym]
    equipment: dumbbell
    load_unit: kg
    weight_basis: single                      # one DB held overhead in both hands
    reps_per_side: false
    movement_pattern: isolation_arms
    role: isolation
    fixed_weight: {value: 3, unit: kg}        # Bangkok condo: fixed 3 kg home DB (B prefers DB ext over cable pushdown)
    fixed_weight_at: [bangkok_condo]          # BKK stays 3 kg; SG gym loads off history (seed below)
    seed_weight: {value: 7.5, unit: kg}       # Singapore-gym cold-start (loaded adjustable DB)

  # ---- pull ----
  - name: Lat Pulldown
