# ---------------------------------------------------------------------------
# Strength exercise catalog — STRUCTURAL data only (slow-changing).
#
# This file answers: which exercises exist, how they map to Garmin FIT codes,
# which VENUE(s) B can do them at (mode.preferred_gym in goals.yaml picks the active
# one), and what equipment + per-venue weight increments apply.
#
# Reps, sets AND rest are deliberately NOT stored here — the planner's model decides ALL
# of them per exercise from best evidence (hypertrophy/strength science: rep ranges by
# role, ~10–20 hard sets/muscle/week, rest by load) AND B's own data: recent
# exercise.strength_sets history, current weight, recovery (sleep/running), the whole
# session mix + the ~80 min budget, and her goals. The catalog is STRUCTURAL only — what
# each exercise IS and how it maps to Garmin — never the prescription.
#
# It deliberately does NOT store B's current working loads. Those change as B gets
# stronger/weaker and are derived LIVE from exercise.strength_sets at planning time.
# `seed_weight` below is only a cold-start hint (used when there is no recent history).
#
# Garmin codes (category, code) come from the FIT profile (see fit.py — "Looking up new
# Garmin codes"). `garmin_aliases` are the SCREAMING_SNAKE labels the Garmin on-device ML
# classifier writes into strength_sets.exercise_name — used to match a catalog exercise to
# B's recorded history. The classifier is sometimes wrong ("Garmin coding error"); refine
# these aliases as real values are observed in strength_sets.
#
# VENUES (mode.preferred_gym picks the active one; effective on the next DEPLOY):
#   bangkok_condo  — B's Bangkok condo gym: free dumbbells in 5 lb steps (Smith exists but unused).
#   singapore_gym  — B's Singapore gym (commercial, machine-rich): dumbbells ALL in kg, cable station.
# Each exercise lists `available_at: [venues]`; the planner shows the model ONLY the active
# venue's exercises. There is NO more apartment/home split — B trains entirely at the gym.
#
# To add an exercise: append an entry. To add/retune a gym: edit meta.venues + available_at.
# Edits go through git (a small PR), matching the project workflow.
# ---------------------------------------------------------------------------

meta:
  # Weight increments B can actually load, per VENUE + equipment family. round_weight_kg
  # (catalog.py) is handed the active venue and snaps a target to a real, loadable weight.
  venues:
    bangkok_condo:
      dumbbell: {unit: lb, step_lb: 5}                                 # free DBs in 5 lb steps (B thinks in lb here)
      stack:    {step_kg_low: 2.5, step_kg_high: 5, threshold_kg: 10}  # cable/machine pin-stacks, kg
    singapore_gym:
      # Dumbbells ALL in kg: 1 kg steps 1–8 kg, then 2.5 kg steps from 10 kg up (no 9 kg).
      dumbbell: {unit: kg, ladder_kg: [1, 2, 3, 4, 5, 6, 7, 8, 10, 12.5, 15, 17.5, 20, 22.5, 25, 27.5, 30, 32.5, 35, 37.5, 40]}
      stack:    {step_kg_low: 2.5, step_kg_high: 5, threshold_kg: 10}  # pin-stacks kg, 2.5 kg steps (assumed; correct on-site)

# available_at: bangkok_condo | singapore_gym (one or both)
# role:      compound | accessory | isolation | core
# equipment: dumbbell | cable | machine | bodyweight
# load_unit: lb | kg | bodyweight — a display/prompt HINT only; the active VENUE drives real rounding
# weight_basis: single (one implement) | each_hand | stack | bodyweight
# reps_per_side: true when the prescribed reps are PER SIDE (cannot be encoded in .fit)
# seed_weight: cold-start hint only; live loads come from strength_sets
# garmin: {category, code} — null means no Garmin code exists (excluded from the .fit)
# pairs_after / pairs_after_at: sequencing constraint, optionally scoped to specific venues

exercises:

  # ---- lower body ----
  - name: Goblet Squat
    watch_label: Goblet Squat
    garmin: {category: 28, code: 37}
    garmin_aliases: [GOBLET_SQUAT]
    available_at: [bangkok_condo, singapore_gym]
    equipment: dumbbell
    load_unit: lb
    weight_basis: single
    reps_per_side: false
    movement_pattern: squat
    role: compound
    seed_weight: {value: 25, unit: lb}

  - name: Bulgarian Split Squat
    watch_label: Bulgarian Split Squat
    garmin: {category: 17, code: 18}          # Garmin only has the loaded (DB) variant
    garmin_aliases: [DUMBBELL_BULGARIAN_SPLIT_SQUAT, BULGARIAN_SPLIT_SQUAT, SPLIT_SQUAT]
    available_at: [bangkok_condo, singapore_gym]
    equipment: dumbbell
    load_unit: lb
    weight_basis: each_hand
    reps_per_side: true
    movement_pattern: squat
    role: compound
    seed_weight: {value: 0, unit: bodyweight}  # currently bodyweight

  - name: Romanian Deadlift
    watch_label: Romanian Deadlift
    garmin: {category: 8, code: 4}            # Garmin "Dumbbell Straight-Leg Deadlift"; no 2-leg RDL
    garmin_aliases: [DUMBBELL_STRAIGHT_LEG_DEADLIFT, ROMANIAN_DEADLIFT, STRAIGHT_LEG_DEADLIFT]
    available_at: [bangkok_condo, singapore_gym]
    equipment: dumbbell
    load_unit: lb
    weight_basis: each_hand
    reps_per_side: false
    movement_pattern: hinge
    role: compound
    seed_weight: {value: 25, unit: lb}

  - name: Hip Thrust
    watch_label: Hip Thrust
    garmin: {category: 10, code: 1}           # Garmin "Barbell Hip Thrust w/ Bench"; machine/plate/bench
    garmin_aliases: [BARBELL_HIP_THRUST, BARBELL_HIP_THRUST_WITH_BENCH, BARBELL_HIP_THRUST_ON_FLOOR, HIP_THRUST, HIP_THRUST_WITH_BENCH]
    available_at: [bangkok_condo, singapore_gym]
    equipment: machine
    load_unit: kg
    weight_basis: single
    reps_per_side: false
    movement_pattern: hinge
    role: compound
    pairs_after: Seated Cable Row             # Bangkok: shares the bench at the cable-row station — row first
    pairs_after_at: [bangkok_condo]           # SG has a proper hip-thrust machine/bench — standalone, no pairing

  - name: Calf Raise
    watch_label: Calf Raise
    garmin: {category: 1, code: 18}           # Standing Calf Raise
    garmin_aliases: [STANDING_CALF_RAISE, CALF_RAISE, SINGLE_LEG_STANDING_CALF_RAISE, "_3_WAY_WEIGHTED_CALF_RAISE"]
    available_at: [bangkok_condo, singapore_gym]
    equipment: machine
    load_unit: kg
    weight_basis: stack
    reps_per_side: false
    movement_pattern: calf
    role: accessory

  - name: Leg Press
    watch_label: Leg Press
    garmin: {category: 28, code: 0}           # SquatExerciseName.LEG_PRESS
    garmin_aliases: [LEG_PRESS, SEATED_LEG_PRESS, LINEAR_LEG_PRESS]
    available_at: [singapore_gym]
    equipment: machine
    load_unit: kg
    weight_basis: stack
    reps_per_side: false
    movement_pattern: squat
    role: compound
    seed_weight: {value: 40, unit: kg}

  - name: Seated Leg Curl
    watch_label: Seated Leg Curl
    garmin: {category: 15, code: 0}           # LegCurlExerciseName.LEG_CURL (no dedicated seated code)
    garmin_aliases: [SEATED_LEG_CURL, LEG_CURL, LYING_LEG_CURL, WEIGHTED_LEG_CURL]
    available_at: [singapore_gym]
    equipment: machine
    load_unit: kg
    weight_basis: stack
    reps_per_side: false
    movement_pattern: leg_curl
    role: isolation
    seed_weight: {value: 20, unit: kg}

  - name: Leg Extension
    watch_label: Leg Extension
    garmin: null                              # No quad leg-extension code in the FIT profile — PNG only, not pushed
    garmin_aliases: [LEG_EXTENSION, LEG_EXTENSIONS, SEATED_LEG_EXTENSION]
    available_at: [singapore_gym]
    equipment: machine
    load_unit: kg
    weight_basis: stack
    reps_per_side: false
    movement_pattern: leg_extension
    role: isolation
    seed_weight: {value: 20, unit: kg}

  - name: Hip Abduction
    watch_label: Hip Abduction
    garmin: {category: 11, code: 28}          # HipStabilityExerciseName.STANDING_HIP_ABDUCTION (closest; B's is the seated machine)
    garmin_aliases: [HIP_ABDUCTION, STANDING_HIP_ABDUCTION, SEATED_HIP_ABDUCTION, HIP_ABDUCTOR, WEIGHTED_STANDING_HIP_ABDUCTION]
    available_at: [singapore_gym]
    equipment: machine
    load_unit: kg
    weight_basis: stack
    reps_per_side: false
    movement_pattern: hip_abduction
    role: isolation
    seed_weight: {value: 20, unit: kg}

  # ---- push ----
  - name: Dumbbell Bench Press
    watch_label: Dumbbell Bench Press
    garmin: {category: 0, code: 6}
    garmin_aliases: [DUMBBELL_BENCH_PRESS, FLAT_DUMBBELL_BENCH_PRESS, ALTERNATING_DUMBBELL_CHEST_PRESS_ON_SWISS_BALL]
